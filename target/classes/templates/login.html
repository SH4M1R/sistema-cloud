<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecera('Iniciar sesión')}"></head>
<body class="flex min-h-screen items-center justify-center bg-slate-100 p-4">
<form th:action="@{/login}" method="post" class="w-full max-w-sm space-y-4 rounded-xl bg-white p-8 shadow">
    <h1 class="text-center text-2xl font-bold text-slate-800">Iniciar sesión</h1>

    <p th:if="${param.error}" class="rounded bg-red-100 px-3 py-2 text-sm text-red-700">
        Usuario o contraseña incorrectos
    </p>
    <p th:if="${param.salio}" class="rounded bg-green-100 px-3 py-2 text-sm text-green-700">
        Sesión cerrada correctamente
    </p>

    <div>
        <label for="username" class="etiqueta">Usuario</label>
        <input id="username" name="username" type="text" required autofocus class="campo">
    </div>
    <div>
        <label for="password" class="etiqueta">Contraseña</label>
        <input id="password" name="password" type="password" required class="campo">
    </div>
    <button type="submit" class="boton-primario w-full">Ingresar</button>
</form>
</body>
</html>
