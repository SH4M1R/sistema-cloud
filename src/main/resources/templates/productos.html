<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecera('Productos')}"></head>
<body class="min-h-screen bg-slate-100">
<nav th:replace="~{fragmentos :: barra}"></nav>

<main class="mx-auto max-w-6xl px-4 py-8">
    <div class="mb-4 flex items-center justify-between">
        <h1 class="text-2xl font-bold text-slate-800">Productos</h1>
        <button type="button" onclick="nuevoProducto()" class="boton-primario">+ Nuevo producto</button>
    </div>

    <div class="overflow-x-auto rounded-xl bg-white shadow">
        <table class="min-w-full text-left text-sm">
            <thead class="bg-slate-50 text-slate-600">
            <tr>
                <th class="px-4 py-3">ID</th>
                <th class="px-4 py-3">Nombre</th>
                <th class="px-4 py-3">Precio</th>
                <th class="px-4 py-3">Stock</th>
                <th class="px-4 py-3 text-right">Acciones</th>
            </tr>
            </thead>
            <tbody class="divide-y">
            <tr th:each="p : ${productos}">
                <td class="px-4 py-3" th:text="${p.id}"></td>
                <td class="px-4 py-3" th:text="${p.nombre}"></td>
                <td class="px-4 py-3" th:text="|S/ ${#numbers.formatDecimal(p.precio, 1, 'COMMA', 2, 'POINT')}|"></td>
                <td class="px-4 py-3" th:text="${p.stock}"></td>
                <td class="space-x-2 px-4 py-3 text-right">
                    <button type="button" onclick="editarProducto(this)" class="boton-editar"
                            th:data-id="${p.id}" th:data-nombre="${p.nombre}"
                            th:data-descripcion="${p.descripcion}" th:data-precio="${p.precio}"
                            th:data-stock="${p.stock}">Editar</button>
                    <button type="button" onclick="eliminarProducto(this.dataset.id)" class="boton-peligro"
                            th:data-id="${p.id}">Eliminar</button>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(productos)}">
                <td colspan="6" class="px-4 py-6 text-center text-slate-500">No hay productos registrados</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<!-- Modal crear / editar producto -->
<div id="modalProducto" class="fixed inset-0 z-40 hidden items-center justify-center bg-black/50 p-4">
    <div class="w-full max-w-md rounded-xl bg-white p-6 shadow-xl">
        <h2 id="tituloProducto" class="mb-4 text-lg font-semibold text-slate-800">Nuevo producto</h2>
        <form id="formProducto" class="space-y-3">
            <input type="hidden" id="pId">
            <div>
                <label class="etiqueta" for="pNombre">Nombre</label>
                <input id="pNombre" type="text" required maxlength="150" class="campo">
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="etiqueta" for="pPrecio">Precio (S/)</label>
                    <input id="pPrecio" type="number" step="0.01" min="0.01" required class="campo">
                </div>
                <div>
                    <label class="etiqueta" for="pStock">Stock</label>
                    <input id="pStock" type="number" step="1" min="0" required class="campo">
                </div>
            </div>
            <div>
                <label class="etiqueta" for="pCategoria">Categoría</label>
                <div class="flex gap-2">
                    <select id="pCategoria" required class="campo">
                        <option value="">Seleccione...</option>
                        <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nombre}"></option>
                    </select>
                    <button type="button" onclick="abrirModal('modalCategoria')" title="Nueva categoría"
                            class="boton-secundario">+</button>
                </div>
            </div>
            <div id="erroresProducto" class="errores hidden rounded bg-red-100 px-3 py-2 text-sm text-red-700"></div>
            <div class="flex justify-end gap-2 pt-2">
                <button type="button" onclick="cerrarModal('modalProducto')" class="boton-secundario">Cancelar</button>
                <button type="submit" class="boton-primario">Guardar</button>
            </div>
        </form>
    </div>
</div>

<!-- Modal nueva categoría -->
<div id="modalCategoria" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50 p-4">
    <div class="w-full max-w-sm rounded-xl bg-white p-6 shadow-xl">
        <h2 class="mb-4 text-lg font-semibold text-slate-800">Nueva categoría</h2>
        <form id="formCategoria" class="space-y-3">
            <div>
                <label class="etiqueta" for="cNombre">Nombre</label>
                <input id="cNombre" type="text" required maxlength="100" class="campo">
            </div>
            <div id="erroresCategoria" class="errores hidden rounded bg-red-100 px-3 py-2 text-sm text-red-700"></div>
            <div class="flex justify-end gap-2 pt-2">
                <button type="button" onclick="cerrarModal('modalCategoria')" class="boton-secundario">Cancelar</button>
                <button type="submit" class="boton-primario">Crear</button>
            </div>
        </form>
    </div>
</div>

<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/productos.js}"></script>
</body>
</html>
