<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecera('Inicio')}"></head>
<body class="min-h-screen bg-slate-100">
<nav th:replace="~{fragmentos :: barra}"></nav>

<main class="mx-auto max-w-4xl px-4 py-12">
    <h1 class="mb-8 text-center text-2xl font-bold text-slate-800">¿Qué deseas administrar?</h1>
    <div class="grid gap-6 sm:grid-cols-2">
        <a th:href="@{/productos}"
           class="block rounded-2xl bg-white p-8 text-center shadow transition hover:-translate-y-1 hover:shadow-lg">
            <h2 class="mt-4 text-xl font-semibold text-slate-800">Productos</h2>
            <p class="mt-1 text-sm text-slate-500">Listado, registro y edición de productos</p>
        </a>
        <a th:href="@{/empleados}"
           class="block rounded-2xl bg-white p-8 text-center shadow transition hover:-translate-y-1 hover:shadow-lg">
            <h2 class="mt-4 text-xl font-semibold text-slate-800">Empleados</h2>
            <p class="mt-1 text-sm text-slate-500">Listado, registro y edición de empleados</p>
        </a>
    </div>
</main>
</body>
</html>
